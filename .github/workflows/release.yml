name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/upload-keystore.jks

      - name: Build release APK and AAB
        env:
          KEYSTORE_FILE: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Stage outputs with version-suffixed names
        run: |
          NAME="${GITHUB_REF_NAME:-manual-${GITHUB_SHA::7}}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk    "dist/drive-monitor-${NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/drive-monitor-${NAME}.aab"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drive-monitor-release
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
